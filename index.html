<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hello">Hello wellcome back</div>

  <div class="card">
    <!-- Tiêu đề thay đổi giữa "Đăng nhập" và "Đăng ký" -->
    <h1 id="title">Đăng nhập</h1>

    <form id="auth-form">
      <label for="username">Tên đăng nhập</label>
      <input type="text" id="username" placeholder="Nhập tên đăng nhập">

      <label for="password">Mật khẩu</label>
      <input type="password" id="password" placeholder="Nhập mật khẩu">

      <button type="submit" id="submit-btn">Đăng nhập</button>
    </form>

    <!-- Nơi hiển thị thông báo lỗi / thành công -->
    <p class="message" id="message"></p>

    <p class="switch">
      <span id="switch-text">Chưa có tài khoản?</span>
      <a id="switch-link">Đăng ký</a>
    </p>
  </div>

  <script src="login.js"></script>
</body>
</html>
